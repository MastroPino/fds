<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flazio DS: Forms</title>
        <!-- Poppins font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- Font Awesome-->
        <link
            rel="stylesheet"
            href="https://kit.fontawesome.com/340462d3b5.css"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="fds-container">
            <button class="fds-btn fds-btn-primary" type="button" disabled>
                <span
                    class="fds-spinner-border"
                    role="status"
                    aria-hidden="true"
                ></span>
                Caricamento...
            </button>
            <button class="fds-btn fds-btn-primary" type="button" disabled>
                <span
                    class="fds-spinner-border fds-spinner-border-sm"
                    role="status"
                    aria-hidden="true"
                ></span>
                Caricamento...
            </button>
            <button class="fds-btn fds-btn-primary" type="button" disabled>
                <span
                    class="fds-spinner-border fds-spinner-border-lg"
                    role="status"
                    aria-hidden="true"
                ></span>
                Caricamento...
            </button>
        </div>
        <script src="scripts/fds-form-range.js"></script>
    </body>
</html>
